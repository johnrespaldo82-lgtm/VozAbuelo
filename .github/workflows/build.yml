name: Compilar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Descomprimir proyecto
        run: unzip -o VozAbuelo.zip || python3 -m zipfile -e VozAbuelo.zip .
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compilar APK
        working-directory: VozAbuelo
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VozAbuelo-apk
          path: VozAbuelo/app/build/outputs/apk/debug/app-debug.apk
